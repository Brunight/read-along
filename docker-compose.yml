services:
  app:
    build: .
    image: reader-sensei
    container_name: reader-sensei-app
    ports:
      # Host port; set APP_PORT in .env to change it.
      - "${APP_PORT:-3000}:3000"
    volumes:
      # Each book folder must contain its .sync/ (generated locally by prep/prep.py).
      - ./books:/books:ro
      # app.sqlite: users, sessions and reading positions.
      - ./data:/data
    # Optional Google login (see .env.example); without it the app is single-user.
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
